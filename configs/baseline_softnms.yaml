# ==================================================================================
# Baseline + Soft-NMS configuration
#
# Use this only for fair post-processing comparisons:
#   Baseline + Soft-NMS  vs  Ours + Soft-NMS
#
# Do not use this as the pure baseline for the main innovation table.
# ==================================================================================

model:
  encoder: "dinov2_windowed_small"
  hidden_dim: 256
  resolution: 560
  pretrain_weights: "rf-detr-base.pth"
  patch_size: 14
  num_queries: 300
  num_select: 300

  # Pure RF-DETR baseline: all innovation modules disabled.
  use_lue: false
  use_dafd: false
  use_dqcd: false
  use_scu: false
  ia_bce_loss: false

  # Same inference-only post-processing as the Soft-NMS appendix setting.
  use_soft_nms: true
  soft_nms_sigma: 0.5
  soft_nms_iou_threshold: 0.6

dataset:
  dataset_file: "coco"
  coco_path: "datasets"

training:
  batch_size: 12
  epochs: 75
  lr: 1e-4
  weight_decay: 1e-4
  lr_drop: 40
  clip_max_norm: 0.1
  checkpoint_interval: 25
  output_dir: "outputs/baseline_softnms"

loss:
  cls_loss_coef: 2.0
  bbox_loss_coef: 5.0
  giou_loss_coef: 5.0
  set_cost_class: 2.0
  set_cost_bbox: 5.0
  set_cost_giou: 5.0

eval:
  eval_interval: 5
  num_select: 300
