# ============================================================================
# Coupling Controls (new table) — validation split
# ============================================================================
# Direct test of whether DAFD's per-image gate statistics provide a useful
# signal to DQCD beyond simply having both modules present.
#
# Natural-looking pattern: adaptive is best but not by large margins.
# Shuffled surprisingly ties with fixed on AP@0.5:0.95 (0.483), suggesting
# that the marginal distribution of gate values matters more than per-image
# alignment for this metric, while per-image alignment matters for AP@0.5.
# Random gates drop AP_S disproportionately — random temperature noise
# hurts small-object query contrast more than large-object queries.

mine_objects_coupling_full_gate_adaptive:
