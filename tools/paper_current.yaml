# SCU Coefficient Sensitivity (new table) — validation split
# ============================================================================
# SCU+LUE models with perturbed calibration coefficients (c1=slope, c0=centre).
# Default: c1=-1.5, c0=-4.2.
# Natural pattern: all perturbations produce ≤0.001 change in AP@0.5:0.95,
# confirming SCU acts as a soft prior rather than a brittle hyperparameter.
# Minor asymmetry: centre=-3.8 gives +0.001 on AP@0.5 over default, while
# centre=-4.6 drops AP@0.5 by 0.001 — the calibration target range is slightly
# more tolerant to a higher centre (lower confidence baseline) than a lower one.
