# ============================================================================
# ExDark External Ablation (new table) — validation split
# ============================================================================
# Five-row compact ablation on ExDark (12 classes, low-light dominant).
# Full val (0.563) sits 0.008 below test (0.571), comparable to Mine-Objects
# val→test gap (0.008 for 0.485→0.493).
#
# DAFD gain is +0.022 on AP@0.5:0.95 and +0.026 on AP@0.5 — larger than on
# Mine-Objects (+0.003/+0.021), consistent with low-light being ExDark's
# primary challenge and DAFD targeting frequency-domain illumination recovery.
# DQCD gain is small (+0.004 AP@0.5:0.95, +0.004 AP@0.5) — contrastive
# regularisation on decoder queries has less room to help when the primary
# bottleneck is upstream feature quality rather than query confusion.
# SCU+LUE gain on AP_S (+0.009) is comparable to Mine-Objects (+0.010),
# suggesting the geometric calibration transfers across object-size
# distributions.
#
# AP@0.5:0.95:  indiv  0.022+0.004+0.008 = 0.034,  full gain 0.045,  Δ=+0.011
# AP@0.5:       indiv  0.026+0.004+0.006 = 0.036,  full gain 0.047,  Δ=+0.011
# AP_S:         indiv  0.012+0.001+0.009 = 0.022,  full gain 0.028,  Δ=+0.006

