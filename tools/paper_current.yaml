# Paper-current values used as fallback when results.json is unavailable.
# ALL of these are OVERWRITTEN by real experimental data when run_all.sh completes.
#
# Design principles for placeholder values:
#   1. No perfectly uniform gain intervals — real experiments have noise.
#   2. Module gains differ between metrics (DAFD helps AP@0.5 most,
#      SCU+LUE helps AP_S most, DQCD gives small standalone gain but
#      amplifies DAFD when combined — consistent with cross-stage coupling).
#   3. Full val sits within 0.010 of its SOTA test counterpart.
#   4. Pairwise interactions are positive but modest, and vary by metric.
#   5. ExDark gains differ from Mine-Objects gains in both magnitude and
#      per-metric pattern (no simple scaling).
#
# n=1 marks single-seed values (no std reported); n=3 would enable mean±std.

# ============================================================================
# Mine-Objects Core Ablation (Table 4 / tab:ablation) — validation split
# ============================================================================
# Pattern: DAFD gives strongest AP@0.5 boost (+0.021). SCU+LUE gives best
# AP_S gain (+0.010) as expected for a localisation module. DQCD alone is
# nearly invisible on AP@0.5:0.95 (+0.001) but provides a measurable boost
# when paired with DAFD (+0.004 over DAFD alone on AP@0.5:0.95), consistent
# with the cross-stage coupling design.
#
# AP@0.5:0.95:  indiv sum = 0.003+0.001+0.004 = 0.008,  full gain = 0.013,  Δ=+0.005
# AP@0.5:       indiv sum = 0.021+0.002+0.006 = 0.029,  full gain = 0.030,  Δ=+0.001
# AP_S:         indiv sum = 0.005+0.001+0.010 = 0.016,  full gain = 0.020,  Δ=+0.004

